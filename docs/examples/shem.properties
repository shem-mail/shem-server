# Minimal Shem configuration for a first installation with Docker Compose
# (see compose.yaml next to this file and ADR 0021). Replace example.org with your own domain.
# Unknown keys fail startup; docs/operations-runbook.md lists the other settings.

data.directory=/data

# Host name the certificate is issued for; the HTTP API origin is https://<first host name>.
tls.hostNames=mail.example.org

# Certificates from Let's Encrypt over HTTP-01. Port 80 must reach acme.challengeBind.
# Read the CA's terms of service before setting agreeToTerms.
acme.directory=https://acme-v02.api.letsencrypt.org/directory
acme.agreeToTerms=true
acme.challengeBind=0.0.0.0:80

# Listeners.
http.bind=0.0.0.0:443
smtp.bind=0.0.0.0:25
submission.implicitTlsBind=0.0.0.0:465
submission.startTlsBind=0.0.0.0:587
imap.bind=0.0.0.0:993
outbound.enabled=true

# First run only: an administrator named "admin" with this initial password (at least 14
# characters), which must be replaced at first login, where TOTP is also enrolled. Ignored once
# the data directory is initialized. Without bootstrap.adminPasswordFile, a password is generated
# into /data/admin/initial-password instead.
bootstrap.adminPasswordFile=/run/secrets/shem_admin_password
bootstrap.domain=example.org
