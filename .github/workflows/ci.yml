# Continuous integration (ADR 0020). Not yet run by the project: validate on the first push.
# Action and image references are pinned by version tag; pinning them to full commit SHAs /
# digests is an open supply-chain task recorded in ADR 0020.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MAVEN_VERSION: 3.9.11
  MAVEN_SHA512: bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978

jobs:
  build:
    name: verify (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Java 21 target (ADR 0001); JDK 25 checks that the build and tests also pass there.
        jdk: ["21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Install pinned Maven
        run: |
          curl -fsSLo maven.tgz "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  maven.tgz" | sha512sum -c -
          tar -xzf maven.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
      - name: Build, test, format and static checks, SBOM
        run: mvn -B -ntp verify
      - name: Versioned distribution
        run: |
          mkdir -p dist/shem-${GITHUB_SHA}
          cp shem-app/target/shem-app.jar dist/shem-${GITHUB_SHA}/
          cp -r shem-app/target/lib dist/shem-${GITHUB_SHA}/
          cp shem-app/target/bom.json dist/shem-${GITHUB_SHA}/sbom.cdx.json
          cp LICENSE NOTICE dist/shem-${GITHUB_SHA}/
          find shem-app/target/third-party -type d -empty -delete
          cp -r shem-app/target/third-party dist/shem-${GITHUB_SHA}/licenses
          tar -C dist -czf shem-${GITHUB_SHA}-jdk${{ matrix.jdk }}.tar.gz shem-${GITHUB_SHA}
      - uses: actions/upload-artifact@v7
        with:
          name: shem-${{ github.sha }}-jdk${{ matrix.jdk }}
          path: shem-${{ github.sha }}-jdk${{ matrix.jdk }}.tar.gz
      - uses: actions/upload-artifact@v7
        if: matrix.jdk == '21'
        with:
          name: sbom
          path: shem-app/target/bom.json

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 detect --source /repo --redact --no-banner

  dependencies:
    name: dependency vulnerabilities
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbom
      - name: osv-scanner on the SBOM
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v1.9.2 --sbom=/src/bom.json
